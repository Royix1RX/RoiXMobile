
name: Build RoiX Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - "roix-source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract and build
        run: |
          unzip -q roix-source.zip -d project
          BUILD_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$BUILD_DIR" ]; then
            echo "Gradle settings file not found in ZIP"
            find project -maxdepth 4 -type f
            exit 1
          fi
          cd "$BUILD_DIR"
          gradle --no-daemon assembleDebug
